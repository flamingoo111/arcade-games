<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Квадратикус: Пекарня Пути</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="screen screen-active">
        <div class="splash-content">
            <div class="splash-logo">🏰</div>
            <h1>Квадратикус</h1>
            <h2>Пекарня Пути</h2>
            <p class="splash-description">
                Помогите Квадратикусу построить самую чудесную пекарню! Выращивайте пшеницу, пеките хлеб и продавайте его довольным клиентам.
            </p>
            <button id="startButton" class="btn-start">Открыть пекарню</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="top-bar">
            <div class="stat">
                <span class="stat-icon">💰</span>
                <span class="stat-value" id="money-value">200</span>
            </div>
            <div class="stat">
                <span class="stat-icon">🕐</span>
                <span class="stat-value" id="timer-value">15:00</span>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="room-tabs">
            <div class="room-tab active">
                <div class="room-tab-icon">🌾</div>
                <div class="room-tab-label">Ферма</div>
            </div>
            <div class="room-tab">
                <div class="room-tab-icon">🔥</div>
                <div class="room-tab-label">Пекарня</div>
            </div>
            <div class="room-tab">
                <div class="room-tab-icon">🛒</div>
                <div class="room-tab-label">Магазин</div>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-container">
            <h1>🎉 Сеанс завершен!</h1>
            
            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-label">Заработано</div>
                    <div class="result-value" id="finalMoney">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-label">Испечено</div>
                    <div class="result-value" id="finalBread">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-label">Продано</div>
                    <div class="result-value" id="finalSells">0</div>
                </div>
            </div>
            
            <p class="quadratikus-message" id="quadratikusMessage"></p>
            
            <button id="restartButton" class="btn-large">Испечь снова</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
